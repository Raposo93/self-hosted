services:
  mikrotik-report:
    image: ${MIKROTIK_REPORT_IMAGE:-ghcr.io/raposo93/mikrotik-report:0.1.2}
    restart: unless-stopped
    stop_grace_period: 1m
    env_file:
      - ${MIKROTIK_REPORT_ENV_FILE:-.env}
    volumes:
      - type: volume
        source: report-data
        target: /var/lib/mikrotik-report
      - type: bind
        source: "${MIKROTIK_CA_HOST_PATH:-/dev/null}"
        target: /etc/ssl/certs/mikrotik-ca.crt
        read_only: true
        bind:
          create_host_path: false

volumes:
  report-data:
