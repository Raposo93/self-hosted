services:
  mikrotik-report:
    image: ${MIKROTIK_REPORT_IMAGE:-ghcr.io/raposo93/mikrotik-report:0.1.2}
    restart: unless-stopped
    stop_grace_period: 1m
    env_file:
      - ${MIKROTIK_REPORT_ENV_FILE:-.env}
    volumes:
      - type: volume
        source: report-data
        target: /var/lib/mikrotik-report

volumes:
  report-data:
