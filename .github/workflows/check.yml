name: Repository checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: |
          python -m pip install -r requirements-check.txt
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run repository checks
        env:
          CHECK_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECK_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ./check.sh
