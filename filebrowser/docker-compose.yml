services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - "${FILEBROWSER_BIND}:${FILEBROWSER_PORT}:80"
    volumes:
      - ${DATA_DIR}:/srv
      - ./filebrowser_config:/config
    environment:
      - FB_BASEURL=/
