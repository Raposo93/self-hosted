services:
  app:
    image: fireflyiii/core:version-6.5.6
    hostname: app
    container_name: firefly
    restart: always
    volumes:
      - ./firefly_iii_upload:/var/www/html/storage/upload:rw
    env_file: .env
    ports:
      - "${FIREFLY_BIND}:${FIREFLY_PORT}:8080"
    networks:
      - firefly_iii

  db:
    image: mariadb:12.3.3
    hostname: db
    container_name: firefly_iii_db
    restart: always
    env_file: .db.env
    volumes:
      - ./firefly_iii_db:/var/lib/mysql:rw
    networks:
      - firefly_iii

  cron:
    image: alpine:3.24.2
    restart: always
    container_name: firefly_iii_cron
    command: sh -c "echo \"0 3 * * * wget -qO- http://app:8080/api/v1/cron/${STATIC_CRON_TOKEN}\" | crontab - && crond -f -L /dev/stdout"
    networks:
      - firefly_iii

networks:
  firefly_iii:
    driver: bridge
