services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "${NAVIDROME_BIND}:${NAVIDROME_PORT}:4533"
    user: "${PUID}:${PGID}"
    volumes:
      - "${MUSIC_DIR}:/music:ro"
      - ./data:/data
    environment:
      ND_ENABLEIMAGECACHE: "true"
      ND_ARTISTARTPRIORITY: "artist.*,album/artist.*,external"
      ND_LASTFM_APIKEY: "${LASTFM_APIKEY}"
      ND_LASTFM_SECRET: "${LASTFM_SECRET}"
